upstream django_app {
    server dsatracker:8000; # Use the container name and internal port
}

server {
    listen 80;
    server_name dsatracker.abckvault.online;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    # IMPORTANT: Nginx serves these directly
    location /static/ {
        alias /app/staticfiles/;
    }
}