version: '3.8'

services:
  dsatracker:
    build: .
    container_name: dsatracker
    networks:
      - dsa-network
    volumes:
      - static_volume:/app/staticfiles
    # No port 8000 here! Nginx will talk to it internally.

  nginx:
    image: nginx:latest
    container_name: dsatracker_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles # Shares the CSS/JS files
    depends_on:
      - dsatracker
    networks:
      - dsa-network

networks:
  dsa-network:
    external: true # Connects to your existing OMV network

volumes:
  static_volume: